name: Deploy API to Cloud Run

# **Se dispara cuando el CI termina, no cuando llega el push.**
#
# `workflow_run` es la única forma de encadenar dos workflows en GitHub
# Actions: espera a que el llamado "CI" concluya y entonces arranca. La
# alternativa —volver a poner `on: push` y repetir aquí lint, build y pruebas—
# duplicaría el pipeline y, lo que es peor, dejaría abierta la puerta a
# desplegar mientras el CI todavía está en rojo, que es exactamente lo que este
# encadenado viene a impedir.
#
# El nombre tiene que coincidir **literalmente** con el `name:` de `ci.yml`. Si
# alguien lo renombra allí y no aquí, este workflow deja de dispararse **sin dar
# ningún error**: no hay nada que avise de que se está esperando a un workflow
# que ya no existe con ese nombre.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

  # ───────────────────────────────────────────────────────────────────────────
  # workflow_dispatch — desplegar sin commit (2026-08-12)
  #
  # Dos disparadores, dos formas distintas de saber **qué commit** se despliega,
  # y de ahí salen los `||` que hay repartidos más abajo:
  #
  # - Por `workflow_run`, el commit lo dice el CI que acaba de aprobarlo
  #   (`github.event.workflow_run.head_sha`).
  # - Por `workflow_dispatch`, ese objeto **no existe** y sus campos salen
  #   vacíos; el commit es el de la rama que se elige en el desplegable
  #   (`github.sha`). Sin el respaldo, `checkout` se traería la rama por defecto
  #   y la imagen se etiquetaría con la cadena vacía.
  #
  # **Este botón se salta el CI a propósito**, y conviene saberlo antes de
  # pulsarlo: publica lo que haya en la rama elegida sin pasar por lint, build
  # ni pruebas. Es la herramienta para aplicar un cambio de variable o repetir
  # un despliegue, no para publicar código sin revisar. Para eso está pulsar el
  # botón en **CI**, que encadena aquí por `workflow_run` con todo en verde.
  # ───────────────────────────────────────────────────────────────────────────
  workflow_dispatch:

# Cancela un despliegue en curso si entra otro: si dos commits se pisan, lo que
# tiene que quedar arriba es el último, no el que acabe de tardar más.
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    # **Las cuatro condiciones son necesarias y ninguna sobra:**
    #
    # - `conclusion == 'success'` — `workflow_run` se dispara también cuando el
    #   CI **falla**; sin esto se desplegaría precisamente el commit roto.
    # - `head_branch == 'master'` — el CI corre también en pull request, y una
    #   rama de trabajo que pase el CI no es motivo para tocar producción.
    # - `event == 'push'` — un CI lanzado por un PR puede traer `head_branch`
    #   apuntando a master en algunos flujos de fork; exigir que el origen sea
    #   un push cierra ese hueco.
    # - `vars.GCP_PROJECT_ID != ''` — mientras la nube no esté provisionada, el
    #   job se **salta** en vez de fallar. Un rojo permanente en Actions por algo
    #   que se sabe que falta enseña a ignorar los rojos, que es justo lo que un
    #   guardarraíl no puede permitirse.
    #
    # **Se comprueba `vars` y no `secrets` a propósito.** El contexto `secrets`
    # **no existe** en el `if` de un job: los contextos admitidos ahí son
    # `github`, `needs`, `vars` e `inputs`. Escribir
    # `if: secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != ''` no deja el job en
    # espera — GitHub rechaza el archivo entero al parsearlo con
    # `Unrecognized named-value: 'secrets'`, así que el workflow deja de existir
    # y no se dispara nunca. `vars.GCP_PROJECT_ID` sirve igual: se pone en el
    # mismo paso de provisión que los secretos, así que su presencia es la misma
    # señal.
    #
    # **Y las tres primeras solo tienen sentido viniendo del CI.** Con
    # `workflow_dispatch` el objeto `github.event.workflow_run` no existe, así
    # que sus tres campos salen vacíos y la condición sería falsa siempre: el
    # botón nuevo estaría puesto pero el job se saltaría en silencio, que es la
    # peor forma de no funcionar. De ahí que se agrupen bajo el disparador que
    # las produce.
    #
    # `vars.GCP_PROJECT_ID != ''` se queda **fuera del paréntesis**, aplicando a
    # los dos caminos: sin proyecto no hay nada que desplegar, venga de donde
    # venga.
    if: >-
      vars.GCP_PROJECT_ID != '' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'master' &&
          github.event.workflow_run.event == 'push'
        )
      )

    permissions:
      # Federación de identidades: el runner pide un token de OIDC a GitHub y
      # Google lo cambia por credenciales. Sin esta línea el token no se emite y
      # el paso de autenticación falla con un mensaje que no explica por qué.
      id-token: write
      contents: read

    env:
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      REGION: ${{ vars.GCP_REGION }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REPOSITORY: ${{ vars.GAR_REPOSITORY }}

    steps:
      # `workflow_run` **no** trae consigo el código del commit que disparó el
      # CI: sin `ref`, `checkout` traería la punta de la rama por defecto, que
      # puede haber avanzado. Se despliega el commit exacto que se puso verde,
      # no "lo último que haya".
      - name: Traer el commit que aprobó el CI
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Autenticarse en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # Federación de identidades en vez de una clave de cuenta de servicio
          # en un secreto: una clave JSON no caduca, no se puede acotar a un
          # repositorio y se queda en el historial de quien la haya copiado.
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # `install_components` no estaba, y por eso el primer intento de
      # desplegar la politica de alerta (2026-08-21, run 32511589977) se planto
      # en su comprobacion previa: `setup-gcloud` instala gcloud **sin** los
      # componentes `alpha` ni `beta`, y toda la gestion de politicas de
      # Monitoring vive en `beta`. El run salio VERDE y no hizo nada, porque el
      # paso esta disenado para no bloquear el despliegue de la API.
      #
      # Es la misma leccion de siempre, aplicada al propio pipeline: **no des por
      # hecho la herramienta**. Doc aviso de esto para `alpha` y resulto valer
      # igual para `beta`.
      - name: Preparar gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: beta

      - name: Dar acceso a Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      # La imagen se etiqueta con el SHA del commit y **no solo con `latest`**:
      # con `latest` no hay forma de saber qué código está sirviendo una
      # revisión, ni de volver a la anterior sin reconstruirla. `latest` se
      # mantiene además, por comodidad al depurar.
      - name: Construir la imagen
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}"

          # El mismo respaldo que en el `checkout` de arriba, y por el mismo
          # motivo: en un despliegue manual no hay `workflow_run`. Si esto
          # quedara vacío, la imagen se etiquetaría `…/pmo-api:` y
          # `SERVICE_VERSION` viajaría en blanco a la revisión.
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"

          if [ -z "${SHA}" ]; then
            echo "::error::No se pudo determinar el commit a desplegar."
            exit 1
          fi

          # El contexto es la RAÍZ del monorepo: el `package-lock.json` que
          # `npm ci` necesita vive ahí, no en `apps/api`.
          docker build \
            -f apps/api/Dockerfile \
            -t "${IMAGE}:${SHA}" \
            -t "${IMAGE}:latest" \
            .

          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "SHA=${SHA}" >> "$GITHUB_ENV"

      - name: Publicar la imagen
        run: |
          docker push "${IMAGE}:${SHA}"
          docker push "${IMAGE}:latest"

      # ─────────────────────────────────────────────────────────────────────
      # La imagen del respaldo, que es otra y muy pequeña
      #
      # No comparte imagen con la API a propósito: aquélla lleva Node y el
      # monorepo entero, y esto solo necesita saber hablar Postgres y escribir
      # en Cloud Storage. Su contexto de construcción es `infra/backup`, no la
      # raíz, porque ahí dentro no hace falta nada del repositorio.
      - name: Construir y publicar la imagen del respaldo
        run: |
          IMAGEN_RESPALDO="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/respaldo-db"

          docker build             -f infra/backup/Dockerfile             -t "${IMAGEN_RESPALDO}:${SHA}"             -t "${IMAGEN_RESPALDO}:latest"             infra/backup

          docker push "${IMAGEN_RESPALDO}:${SHA}"
          docker push "${IMAGEN_RESPALDO}:latest"

          echo "IMAGEN_RESPALDO=${IMAGEN_RESPALDO}" >> "$GITHUB_ENV"

      # ─────────────────────────────────────────────────────────────────────
      # Migraciones — un Job de Cloud Run, y ANTES de publicar la revisión
      #
      # **El orden no es negociable.** Si la revisión nueva sale primero, su
      # código pide columnas que todavía no existen y los 500 empiezan antes de
      # que la migración corra. Al revés, la ventana de riesgo es la contraria y
      # se puede controlar: entre migrar y desplegar, quien está sirviendo es la
      # revisión **vieja** contra el esquema **nuevo**.
      #
      # De ahí la única regla que hay que respetar al escribir una migración:
      # **tiene que ser compatible con el código que ya está arriba**. Añadir
      # columnas y tablas lo es; renombrar o borrar no. Lo que se borra se hace
      # en dos despliegues (primero deja de usarse, después se elimina).
      #
      # **Por qué un Job y no un paso del runner.** Desde la migración a Cloud
      # SQL (2026-08-18) vuelve a valer el motivo original: la instancia no
      # tiene IP pública y se llega por el **Auth Proxy**, que en un runner de
      # GitHub habría que montar a mano. _Durante la etapa de Neon ese motivo
      # decayó —era Postgres público— y quedó en pie el segundo, que no ha
      # dejado de valer nunca:_ así **`DATABASE_URL` no sale nunca de Google
      # Cloud**. El Job la recibe de Secret Manager igual que el servicio;
      # traerla al runner la pondría en el entorno de un proceso de GitHub para
      # no ganar nada.
      #
      # `jobs deploy` es crear-o-actualizar, así que este paso vale igual la
      # primera vez que la enésima y **el Job siempre corre la imagen de este
      # commit**, no la del anterior. Con `jobs create` habría que acordarse de
      # actualizarlo a mano, y el día que alguien lo olvidara migraría con un
      # esquema viejo sin que nada lo dijera.
      #
      # ⚠️ **`prisma migrate deploy` sobre una base que ya tiene tablas pero no
      # `_prisma_migrations` falla con `P3005`.** No es un fallo del comando: es
      # que no puede saber qué se aplicó ya. Si sale, se marcan como aplicadas
      # las que correspondan (`prisma migrate resolve --applied <nombre>`) y se
      # vuelve a lanzar. Falla **antes** de desplegar, así que la revisión que
      # está sirviendo no se toca.
      # ─────────────────────────────────────────────────────────────────────
      # ⚠️ **`--args=` con el igual, no separado por espacio.** El primer
      # elemento de la lista es `--workspace`, y con `--args "…"` el parser de
      # gcloud ve algo que empieza por `--`, lo toma por la bandera siguiente y
      # muere con `argument --args: expected one argument`. Pegado con `=`, el
      # valor se lee entero. Comprobado con las dos formas: sin el igual falla
      # al parsear, con él llega hasta la llamada a la API.
      - name: Migrar la base de datos
        run: |
          gcloud run jobs deploy "${SERVICE}-migrate" \
            --image="${IMAGE}:${SHA}" \
            --region="${REGION}" \
            --set-cloudsql-instances="pmo-dashboard-503418:us-central1:pmo-postgres-db" \
            --set-secrets="DATABASE_URL=pmo-database-url:latest" \
            --max-retries=0 \
            --task-timeout=10m \
            --command=npm \
            --args="--workspace,@pmo/api,exec,--,prisma,migrate,deploy" \
            --quiet

          # `--wait` es lo que convierte esto en una puerta: sin él el comando
          # vuelve en cuanto encola la ejecución y el despliegue seguiría
          # adelante sin saber si la migración cuajó.
          gcloud run jobs execute "${SERVICE}-migrate" \
            --region "${REGION}" \
            --wait

      # ─────────────────────────────────────────────────────────────────────
      # GOOGLE_CLOUD_PROJECT — leer esto antes de tocar la lista de variables
      #
      # **Cloud Run NO la inyecta.** Inyecta `K_SERVICE` y `K_REVISION`, que la
      # API ya aprovecha para identificar servicio y versión, pero el id del
      # proyecto no lo pone nadie.
      #
      # Sin ella, `traceFieldsFrom` devuelve `{}` —decisión deliberada: el
      # enlace de rastro tiene que llevar la forma `projects/<id>/traces/<hex>`
      # y a medias no correlaciona nada—, así que **los logs salen, se leen
      # bien y parecen correctos, pero las líneas de una misma petición dejan
      # de agruparse en la consola**. Es un fallo silencioso: no hay error, no
      # hay aviso en Cloud Logging, y se descubre el día que hace falta seguir
      # una petición y no se puede.
      #
      # La API lo avisa al arrancar (`avisoDeConfiguracion`), así que si algún
      # día falta, el aviso está en la primera línea de log de la revisión.
      # ─────────────────────────────────────────────────────────────────────
      #
      # ─────────────────────────────────────────────────────────────────────
      # GOOGLE_REDIRECT_URI — sin ella el contenedor NO ARRANCA
      #
      # `AuthService` la pide con `getOrThrow` en su constructor, y los
      # proveedores de Nest se construyen al arrancar: si falta, la aplicación
      # revienta antes de escuchar en el 8080 y Cloud Run informa de **timeout
      # de arranque**, sin mencionar ninguna variable. Subir el timeout del
      # servicio no ayuda: no es que tarde, es que no llega.
      #
      # Va por `vars` y no por Secret Manager porque no es un secreto — es la
      # URL de vuelta del login, pública por definición. Tiene que coincidir
      # **carácter a carácter** con una de las URIs autorizadas del cliente
      # OAuth en la consola de Google: la forma es
      # `https://<url-de-cloud-run>/auth/google/callback`.
      # ─────────────────────────────────────────────────────────────────────
      #
      # ─────────────────────────────────────────────────────────────────────
      # CLAUDE_MODEL_* — variables de repositorio, y opcionales
      #
      # **Los tres secretos no existen.** Se intentaron por Secret Manager dos
      # veces y las dos lo desmintió el propio `gcloud`:
      # `Secret projects/614812477499/secrets/pmo-claude-model-classify/versions/latest
      # was not found`. La segunda vez (`d3547fc`, 2026-08-05) se volvieron a
      # poner sobre un reporte de que ya estaban aprovisionados; no lo estaban,
      # y `gcloud secrets list` sigue mostrando ocho secretos sin estos tres.
      # El coste no fue solo un despliegue rojo: la revisión condenada
      # (`pmo-api-00009-pxt`) dejó al servicio **sin ruta y sin URL**, tumbando
      # la 00008, que sí estaba lista.
      #
      # No son credenciales —son ids de modelo, públicos— así que viven en
      # `vars` del repositorio, donde cambiarlos no obliga a crear una versión
      # de secreto.
      #
      # **Opcionales a propósito.** El código trae un valor bueno para los tres
      # (`ai.service.ts` y `model-tiers.ts`) y avisa en el log cuando usa el
      # suyo, así que una variable que falta cambia el modelo, no tumba el
      # despliegue. Es lo contrario de `GOOGLE_REDIRECT_URI`, que no se puede
      # adivinar y por eso sí para el despliegue.
      #
      # Si algún día se prefieren en Secret Manager, se crean los tres secretos
      # —comprobando que existen, no dando por buena la palabra de que existen—
      # y se mueven a `--set-secrets`; el código no se entera.
      # ─────────────────────────────────────────────────────────────────────
      - name: Desplegar en Cloud Run
        run: |
          FRONTEND_URL="${{ vars.WEB_URL }}"

          # Sin URI de vuelta el contenedor no arranca (ver el bloque de
          # arriba), así que se para aquí, con el motivo escrito, en vez de
          # desplegar una revisión condenada a un timeout que no explica nada.
          #
          # **No basta con que esté puesta.** Una URI presente pero equivocada
          # arranca igual y rompe el login más tarde, con Google devolviendo
          # `redirect_uri_mismatch` desde su propia pantalla: un error que
          # parece del cliente OAuth y no de este despliegue. Las tres
          # comprobaciones de abajo son las tres formas en que ya se escribió
          # mal — un marcador `<DOMAIN>` sin sustituir, un esquema que no es
          # https, y una ruta inventada.
          #
          # La ruta es fija y se puede comprobar: el controlador es
          # `@Controller("auth")` con `@Get("google/callback")` y `main.ts` **no
          # pone prefijo global**, así que la única ruta que existe es
          # `/auth/google/callback`. Nada de `/api`, nada de `/v1`.
          REDIRECT_URI="${{ vars.GOOGLE_REDIRECT_URI }}"
          MOTIVO=""
          if [ -z "${REDIRECT_URI}" ]; then
            MOTIVO="no está definida"
          elif [[ "${REDIRECT_URI}" == *"<"* || "${REDIRECT_URI}" == *">"* ]]; then
            MOTIVO="conserva un marcador de posición sin sustituir: ${REDIRECT_URI}"
          elif [[ "${REDIRECT_URI}" != https://* ]]; then
            MOTIVO="no empieza por https://: ${REDIRECT_URI}"
          else
            # La ruta completa, no el final: `.../api/v1/auth/google/callback`
            # también *termina* en `/auth/google/callback` y sería igual de
            # inválida. Se recorta el esquema, luego el host, y lo que queda
            # tiene que ser exactamente la ruta del controlador.
            SIN_ESQUEMA="${REDIRECT_URI#https://}"
            RUTA="/${SIN_ESQUEMA#*/}"
            if [[ "${RUTA}" != "/auth/google/callback" ]]; then
              MOTIVO="apunta a ${RUTA} y la única ruta que existe es /auth/google/callback (sin prefijo global)"
            fi
          fi

          if [ -n "${MOTIVO}" ]; then
            echo "::error::La variable de repositorio GOOGLE_REDIRECT_URI ${MOTIVO}." \
                 "Tiene que ser https://<url-de-cloud-run>/auth/google/callback," \
                 "y esa misma URI debe estar autorizada en el cliente OAuth de Google Cloud."
            exit 1
          fi

          # ───────────────────────────────────────────────────────────────
          # WEB_URL — el guardarraíl que faltaba (2026-08-12)
          #
          # `GOOGLE_REDIRECT_URI` tenía cuatro comprobaciones aquí arriba y ya
          # paró dos despliegues. `WEB_URL` no tenía **ninguna**: se aceptaba
          # cualquier cadena, con un respaldo `placeholder.com` que no existe.
          # Por ese hueco entraron los dos fallos de agosto, y cada uno costó
          # un diagnóstico entero:
          #
          # - **08-07:** apuntaba a `pmo-frontend.vercel.app`, que sirve **otra
          #   aplicación** —«PMO Digital», en portugués, con Supabase— porque
          #   los dos proyectos se llaman PMO. El login moría en un 404 que
          #   parecía de OAuth sin serlo.
          # - **08-10:** se corrigió al alias con sufijo de proyecto, que está
          #   detrás del **SSO de Vercel** y responde 302 a quien no tenga
          #   sesión en esa cuenta. Funcionaba para su dueño y para nadie más.
          #
          # Las dos comprobaciones de abajo cazan exactamente esos dos casos y
          # no cuestan más que un `curl` y un `grep`.
          #
          # **Sin `-L`, a propósito.** Un 302 no se sigue: aquí `WEB_URL` es el
          # sitio donde aterriza el navegador al volver de Google, así que
          # cualquier cosa que no sea servir la aplicación directamente es el
          # fallo que se busca. Siguiendo el redirect, la puerta del SSO
          # devolvería 200 y la comprobación (a) pasaría por buena justo el
          # caso que existe para cazar.
          #
          # **La tercera comprobación —el preflight de CORS— no puede ir aquí.**
          # Mira la revisión que está sirviendo, que todavía lleva la `WEB_URL`
          # **vieja**; puesta antes del despliegue fallaría precisamente cuando
          # la variable cambia, que es el caso que hay que dejar pasar. Va
          # después de desplegar, como post-condición, en su propio paso al
          # final de este archivo.
          # ───────────────────────────────────────────────────────────────
          if [ -z "${FRONTEND_URL}" ]; then
            echo "::error::La variable de repositorio WEB_URL no está definida." \
                 "Es el origen que admite el CORS y el destino al que vuelve el login:" \
                 "sin ella la API se despliega y el frontend no puede hablarle."
            exit 1
          fi

          echo "Comprobando WEB_URL: ${FRONTEND_URL}"
          CODIGO_WEB=$(curl -sS -o /tmp/web.html -w '%{http_code}' --max-time 20 "${FRONTEND_URL}" || echo "000")

          if [ "${CODIGO_WEB}" != "200" ]; then
            echo "::error::WEB_URL (${FRONTEND_URL}) devolvió ${CODIGO_WEB} sin credenciales, y tiene que devolver 200." \
                 "Un 3xx suele ser la protección de despliegue de Vercel: ese dominio solo sirve a quien tenga sesión" \
                 "en la cuenta, así que el login terminaría en la pantalla de Vercel para todos los demás." \
                 "Un 000 es que no respondió."
            exit 1
          fi

          if ! grep -q '<title>PMO Dashboard' /tmp/web.html; then
            echo "::error::WEB_URL (${FRONTEND_URL}) responde 200 pero no sirve este frontend:" \
                 "su HTML no contiene <title>PMO Dashboard, que es el de apps/web/index.html." \
                 "Comprueba que el dominio es el de este proyecto y no el de otro que se llame parecido."
            echo "Primeros 400 caracteres de lo que sirvió:"
            head -c 400 /tmp/web.html || true
            exit 1
          fi

          echo "WEB_URL sirve este frontend y responde sin credenciales."

          # Los ids de modelo se añaden **solo si están puestos**: pasarlos
          # vacíos escribiría `CLAUDE_MODEL_CLASSIFY=` en la revisión, que el
          # código trata como ausente pero que en la consola de Cloud Run se lee
          # como una variable configurada a nada. Mejor que no aparezca.
          ENV_VARS="NODE_ENV=production,LOG_FORMAT=gcp,GOOGLE_CLOUD_PROJECT=${PROJECT_ID}"
          ENV_VARS="${ENV_VARS},WEB_URL=${FRONTEND_URL:-https://pmo-frontend.placeholder.com}"
          ENV_VARS="${ENV_VARS},GOOGLE_REDIRECT_URI=${REDIRECT_URI},SERVICE_VERSION=${SHA}"

          for VARIABLE in \
            "CLAUDE_MODEL_CLASSIFY=${{ vars.CLAUDE_MODEL_CLASSIFY }}" \
            "CLAUDE_MODEL_REASONING=${{ vars.CLAUDE_MODEL_REASONING }}" \
            "CLAUDE_MODEL_CHEAP=${{ vars.CLAUDE_MODEL_CHEAP }}"; do
            if [ -n "${VARIABLE#*=}" ]; then
              ENV_VARS="${ENV_VARS},${VARIABLE}"
            else
              echo "::notice::${VARIABLE%%=*} no está definida; la API usará su modelo por defecto y lo dirá en el log de arranque."
            fi
          done

          # ───────────────────────────────────────────────────────────────
          # Configuración de ejecución — y por qué tiene que estar AQUÍ
          #
          # Abajo se despliega con **`--set-env-vars`**, que **reemplaza el
          # conjunto entero** de variables de la revisión; no lo completa. Todo
          # lo que no se arme en esta cadena desaparece en el siguiente
          # despliegue, aunque alguien lo hubiera inyectado en caliente con
          # `gcloud run services update`. Eso ya pasó: la configuración puesta
          # a mano sobrevivía hasta el primer push y se perdía sin un solo
          # error, justo cuando todo parecía por fin arreglado.
          #
          # Por eso estas cinco viven aquí y no en un comando suelto:
          #
          # - `COPILOT_EMAIL_TRANSPORT` — decide si el copiloto envía correos de
          #   verdad. `copilot.module.ts` solo enciende el envío real con `real`
          #   o `smtp`; **su ausencia significa simulado**, así que perderla ya
          #   no manda un correo auténtico a un destinatario real. Ese respaldo
          #   se invirtió el 2026-08-12, precisamente porque esta variable se
          #   perdía en cada despliegue y el descuido caía del lado que no se
          #   puede deshacer. Sigue inyectándose para que el entorno diga lo que
          #   hace en vez de depender de un valor por defecto.
          # - Las cuatro `GMAIL_PUBSUB_*` — sin ellas la ingesta de correo no
          #   puede funcionar, y la revisión sale verde igual porque nada de
          #   esto se comprueba al arrancar. Es la pieza número uno del producto
          #   fallando en silencio.
          #
          # ⚠️ Los valores **no pueden contener comas**: `--set-env-vars` separa
          # por comas y una coma dentro de un valor partiría la variable en dos.
          # Vale para toda esta cadena, incluidos los ids de modelo de arriba.
          # ───────────────────────────────────────────────────────────────
          # Las dos `CRON_*` identifican a **Cloud Scheduler**, que firma con su
          # propia cuenta de servicio y no con la de Pub/Sub. Reutilizar las
          # `GMAIL_PUBSUB_*` para las rutas de `/cron` daría 401 —son emisores
          # distintos— y aflojar el guard para aceptar ambas dejaría que el
          # webhook de Gmail pudiera disparar el barrido de vencidas, y al revés.
          # Cada puerta valida a su emisor, así que cada una necesita su par.
          for VARIABLE in \
            "COPILOT_EMAIL_TRANSPORT=${{ vars.COPILOT_EMAIL_TRANSPORT }}" \
            "GMAIL_PUBSUB_TOPIC=${{ vars.GMAIL_PUBSUB_TOPIC }}" \
            "GMAIL_PUBSUB_AUDIENCE=${{ vars.GMAIL_PUBSUB_AUDIENCE }}" \
            "GMAIL_PUBSUB_SERVICE_ACCOUNT=${{ vars.GMAIL_PUBSUB_SERVICE_ACCOUNT }}" \
            "GMAIL_PUBSUB_ALLOW_UNSIGNED=${{ vars.GMAIL_PUBSUB_ALLOW_UNSIGNED }}" \
            "CRON_OIDC_AUDIENCE=${{ vars.CRON_OIDC_AUDIENCE }}" \
            "CRON_SERVICE_ACCOUNT=${{ vars.CRON_SERVICE_ACCOUNT }}"; do
            NOMBRE="${VARIABLE%%=*}"
            VALOR="${VARIABLE#*=}"

            if [ -n "${VALOR}" ]; then
              ENV_VARS="${ENV_VARS},${VARIABLE}"
              continue
            fi

            case "${NOMBRE}" in
              COPILOT_EMAIL_TRANSPORT)
                echo "::notice::COPILOT_EMAIL_TRANSPORT no está definida; el copiloto usará el transporte SIMULADO y no enviará correos." \
                     "Para enviar de verdad, ponla a 'real' o 'smtp'."
                ;;
              CRON_*)
                # Aviso y no nota al pie: el guard falla cerrado, así que sin
                # esto Cloud Scheduler recibe 401 en cada cita y el barrido de
                # vencidas no corre. Los jobs se ven «ejecutados» en la consola
                # de Scheduler igualmente, que es como se pierde una tarde.
                echo "::warning::${NOMBRE} no está definida; las rutas /cron rechazarán a Cloud Scheduler con 401" \
                     "y las tareas vencidas dejarán de marcarse."
                ;;
              *)
                echo "::notice::${NOMBRE} no está definida; la ingesta de Gmail seguirá inactiva en esta revisión."
                ;;
            esac
          done

          # No se bloquea el despliegue —puede haber un motivo puntual para
          # depurar sin firma—, pero que no pase inadvertido: esta bandera apaga
          # la verificación OIDC del webhook de Pub/Sub, y con la API abierta a
          # peticiones anónimas eso deja el buzón de entrada expuesto a
          # cualquiera que conozca la ruta.
          if [ -n "${{ vars.GMAIL_PUBSUB_ALLOW_UNSIGNED }}" ] && [ "${{ vars.GMAIL_PUBSUB_ALLOW_UNSIGNED }}" != "false" ]; then
            echo "::warning::GMAIL_PUBSUB_ALLOW_UNSIGNED está puesta a '${{ vars.GMAIL_PUBSUB_ALLOW_UNSIGNED }}' en producción:" \
                 "el webhook de Pub/Sub aceptará mensajes sin verificar su firma."
          fi

          # ───────────────────────────────────────────────────────────────
          # Secretos de Secret Manager
          #
          # La URL del webhook de alertas **es una credencial**: quien la tenga
          # puede escribir en el canal de Google Chat. Por eso viaja por aquí y
          # no como variable de entorno en claro.
          #
          # Se añade **condicionada a `vars.ALERT_WEBHOOK_SECRET`** —el nombre
          # del secreto— y no fija en la cadena, por una razón de orden: un
          # `--set-secrets` que nombre un secreto inexistente **falla el
          # despliegue entero**. Fijarla aquí antes de que el secreto exista
          # dejaría la API sin poder desplegarse hasta que alguien lo creara, y
          # el error hablaría de secretos, no de este cambio. Con la variable de
          # por medio, el orden deja de importar: se crea el secreto, se pone la
          # variable, y el siguiente despliegue la recoge.
          # ───────────────────────────────────────────────────────────────
          SECRETS="DATABASE_URL=pmo-database-url:latest"
          SECRETS="${SECRETS},REDIS_URL=pmo-redis-url:latest"
          SECRETS="${SECRETS},JWT_SECRET=pmo-jwt-secret:latest"
          SECRETS="${SECRETS},TOKEN_ENCRYPTION_KEY=pmo-token-encryption-key:latest"
          SECRETS="${SECRETS},GOOGLE_CLIENT_ID=pmo-google-client-id:latest"
          SECRETS="${SECRETS},GOOGLE_CLIENT_SECRET=pmo-google-client-secret:latest"
          SECRETS="${SECRETS},ANTHROPIC_API_KEY=pmo-anthropic-api-key:latest"
          SECRETS="${SECRETS},GEMINI_API_KEY=pmo-gemini-api-key:latest"

          if [ -n "${{ vars.ALERT_WEBHOOK_SECRET }}" ]; then
            SECRETS="${SECRETS},ALERT_WEBHOOK_URL=${{ vars.ALERT_WEBHOOK_SECRET }}:latest"
          else
            echo "::warning::ALERT_WEBHOOK_SECRET no está definida; la API no podrá enviar alertas." \
                 "Crea el secreto con la URL del webhook de Google Chat y pon aquí su nombre."
          fi

          # ───────────────────────────────────────────────────────────────
          # --allow-unauthenticated — quién llama a esta API
          #
          # Cloud Run nace **privado**: sin esta bandera, su puerta de entrada
          # devuelve **403 a toda petición anónima antes de tocar el
          # contenedor**, así que la API arranca perfectamente, la revisión
          # queda lista y sirviendo, y aun así no la alcanza nadie. Es lo que
          # tumbó el despliegue del 2026-08-07: el `gcloud run deploy` salió
          # con 0 y fue la sonda de aquí abajo la que se comió cinco 403.
          #
          # Los tres que llaman son anónimos por naturaleza y ninguno puede
          # presentar un token de Google: el SPA de Vercel llama desde el
          # navegador del usuario, el callback de OAuth lo abre Google en ese
          # mismo navegador, y Pub/Sub empuja al webhook.
          #
          # **Abierto no es desprotegido.** Lo que guarda los datos es la capa
          # de la aplicación, entregada en el Sprint 8: `AuthGuard` con la
          # cookie de sesión, el límite por IP en tres tramos, el CORS acotado
          # a `WEB_URL` y el `PubSubAuthGuard`, que verifica la firma OIDC del
          # webhook. Lo que queda público a propósito es lo que tiene que
          # serlo: `/health/*` y el callback de OAuth.
          # ───────────────────────────────────────────────────────────────
          # ───────────────────────────────────────────────────────────────
          # `--no-cpu-throttling`: la CPU sigue asignada entre peticiones.
          #
          # No es una optimización, es un requisito: los workers de BullMQ
          # —sincronización de Gmail y clasificación— hacen su trabajo **fuera**
          # del ciclo de una petición HTTP. Con el estrangulamiento por defecto,
          # Cloud Run le quita la CPU al contenedor en cuanto contesta, así que
          # un job encolado se queda a medias hasta que otra petición despierte
          # la instancia. El aviso del webhook se responde en milisegundos; lo
          # que tarda es lo de después.
          #
          # Se pone aquí porque **estaba aplicado a mano en el servicio**
          # (`run.googleapis.com/cpu-throttling=false`, revisión `00057-ksl`,
          # creada desde una consola y no por este pipeline). Una configuración
          # que solo vive en la consola sobrevive mientras nadie recree el
          # servicio: escrita aquí, se vuelve a poner sola en cada despliegue y
          # se puede leer sin abrir Google Cloud.
          #
          # ⚠️ **Tiene precio**: se factura CPU durante toda la vida de la
          # instancia, no solo mientras atiende. Con `--max-instances=8` y
          # escalado a cero el gasto sigue siendo pequeño, pero si algún día la
          # factura de Cloud Run sorprende, este flag es el primer sitio donde
          # mirar.
          #
          # ── Los cuatro números que faltaban (2026-08-21) ─────────────────
          #
          # Hasta hoy este comando no pasaba `--timeout`, `--max-instances`,
          # `--concurrency`, `--cpu` ni `--memory`. La palabra `maxScale`
          # aparecía **una sola vez en todo el archivo, aquí arriba en un
          # comentario**, justificando el coste de `--no-cpu-throttling` con un
          # número que el comando no fijaba. Es el fallo contra el que este
          # mismo archivo advierte —configuración que solo vive fuera de él—
          # cometido en el comentario que lo advierte.
          #
          # Matiz que conviene no perder: el servicio vivo **sí** tenía
          # `maxScale=20`, puesto a mano en la consola. No regía el defecto de
          # 100 porque `gcloud run deploy` conserva lo que no se le nombra. O
          # sea: no estaba mal configurado, estaba configurado **en un sitio que
          # no se revisa y que desaparece el día que alguien recree el
          # servicio**. Que es peor de diagnosticar y exactamente igual de malo.
          #
          # - `--timeout=900s`. El defecto son 300 s, y el copiloto se concedía
          #   **10 minutos por llamada al modelo**: la plataforma cortaba la
          #   petición por debajo del código y el stream moría **sin evento
          #   `error`**. Ahora los dos números se respetan una invariante que
          #   está escrita también en `anthropic.strategy.ts`:
          #     MAX_VUELTAS × TIMEOUT_MS + herramientas < timeout de Cloud Run
          #              4 × 180 s = 720 s + margen     < 900 s
          #
          # - `--max-instances=8`, y **el límite no es el tráfico, es la base**.
          #   Cada instancia abre su propio pool de Prisma; el total contra
          #   Cloud SQL es ese pool × instancias vivas. Con `connection_limit=2`
          #   (fijado en `prisma.service.ts`, con la tabla del reparto): 8 × 2 =
          #   16, más el job de migraciones, el de respaldo y alguna sesión
          #   manual ≈ 19, por debajo de las ~25 que da un `db-f1-micro`.
          #   Veinte instancias serían 40 conexiones y la base no las admite.
          #   Hoy es teórico —hay un usuario— pero **lo que lo dispararía es un
          #   bucle de reintentos**, y de esos acabamos de cerrar uno.
          #
          # - `--concurrency=80`, `--cpu=1`, `--memory=512Mi`. Son los valores
          #   que el servicio ya tenía: se escriben **sin cambiarlos**, para que
          #   la aritmética de arriba se pueda leer entera aquí y para que
          #   sobrevivan a que alguien recree el servicio.
          # ───────────────────────────────────────────────────────────────
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}:${SHA}" \
            --region "${REGION}" \
            --platform managed \
            --port 8080 \
            --set-cloudsql-instances="pmo-dashboard-503418:us-central1:pmo-postgres-db" \
            --allow-unauthenticated \
            --no-cpu-throttling \
            --timeout=900s \
            --max-instances=8 \
            --concurrency=80 \
            --cpu=1 \
            --memory=512Mi \
            --set-env-vars "${ENV_VARS}" \
            --set-secrets "${SECRETS}" \
            --quiet

      # Comprobación de verdad: que la revisión conteste, no que el comando de
      # despliegue haya salido con 0. `/health/ready` mira Postgres y Redis, así
      # que un 200 aquí dice que la revisión **puede atender**, que es lo que se
      # quería saber. `/health/live` diría que sí con la base caída.
      - name: Comprobar que la revisión atiende
        run: |
          URL=$(gcloud run services describe "${SERVICE}" \
                  --region "${REGION}" --format 'value(status.url)')

          echo "Revisión desplegada en ${URL}"

          for intento in 1 2 3 4 5; do
            CODIGO=$(curl -s -o /tmp/ready.json -w '%{http_code}' "${URL}/health/ready" || true)
            echo "intento ${intento}: ${CODIGO}"

            if [ "${CODIGO}" = "200" ]; then
              cat /tmp/ready.json
              exit 0
            fi

            sleep 10
          done

          echo "La revisión no llegó a responder 200 en /health/ready:"
          cat /tmp/ready.json || true
          exit 1

      # ─────────────────────────────────────────────────────────────────────
      # La tercera comprobación de `WEB_URL`, y va DESPUÉS de desplegar
      #
      # Las otras dos —que responda 200 sin credenciales y que sirva este
      # frontend— miran el dominio y pueden correr antes. Esta mira **la
      # revisión recién publicada**, así que antes de desplegar habría
      # interrogado a la revisión vieja, con la `WEB_URL` vieja, y habría
      # fallado justo en el despliegue que cambia la variable: el único que no
      # debe bloquearse.
      #
      # Puesta aquí es una post-condición y comprueba lo que de verdad
      # importaba: que el valor **llegó** a la revisión que está sirviendo. Un
      # `gcloud run deploy` que sale con 0 no lo dice; dice que la API aceptó el
      # comando.
      #
      # Se pide `OPTIONS /auth/me` porque es la ruta que llama el SPA nada más
      # cargar, y su preflight es exactamente el que falla en un navegador real
      # cuando el origen no está admitido. La lista de orígenes de la API es
      # fija —no un eco de lo que pregunte el cliente—, así que la cabecera solo
      # devuelve el origen si de verdad está en ella.
      # ─────────────────────────────────────────────────────────────────────
      - name: Comprobar que el CORS de la revisión admite WEB_URL
        run: |
          URL=$(gcloud run services describe "${SERVICE}" \
                  --region "${REGION}" --format 'value(status.url)')
          ORIGEN="${{ vars.WEB_URL }}"

          PERMITIDO=$(curl -sS -D - -o /dev/null --max-time 20 \
                        -X OPTIONS "${URL}/auth/me" \
                        -H "Origin: ${ORIGEN}" \
                        -H "Access-Control-Request-Method: GET" \
                      | tr -d '\r' \
                      | grep -i '^access-control-allow-origin:' \
                      | head -1 \
                      | cut -d' ' -f2- || true)

          echo "origen pedido:   ${ORIGEN}"
          echo "origen admitido: ${PERMITIDO:-(ninguno)}"

          if [ "${PERMITIDO}" != "${ORIGEN}" ]; then
            echo "::error::La revisión desplegada no admite ${ORIGEN} en CORS." \
                 "El despliegue salió con 0 pero la variable no llegó a la revisión que sirve," \
                 "así que el navegador bloqueará todas las llamadas del frontend."
            exit 1
          fi

          echo "El CORS de la revisión admite el origen del frontend."

      # ─────────────────────────────────────────────────────────────────────
      # El Job de respaldo diario — configuración que vivía solo en la consola
      #
      # Se creó a mano el 2026-08-18 y **se parcheó a mano** cuando la migración
      # a Cloud SQL lo dejó sin poder alcanzar la base. Eso es exactamente la
      # configuración fantasma que este paso viene a eliminar: lo que solo vive
      # en la consola no se puede revisar, no se puede revertir y nadie sabe que
      # existe hasta que se rompe.
      #
      # **Va al final a propósito.** Si este paso fallara, la API ya está
      # desplegada y comprobada: un problema con el respaldo no debe impedir que
      # el producto salga.
      #
      # ⚠️ **No hay `--no-cpu-throttling` aquí, y no es un olvido.** Esa bandera
      # no existe para los Jobs de Cloud Run porque no hace falta: el
      # estrangulamiento de CPU es un concepto de **servicios**, atado al ciclo
      # de vida de la petición. En un Job la CPU está asignada durante toda la
      # tarea por definición, así que el `pg_dump` no se puede congelar a mitad
      # como se congelaban las alertas del servicio. Añadirla tumbaría el
      # despliegue con `unrecognized arguments`.
      #
      # `jobs deploy` es crear-o-actualizar, igual que el de migraciones: vale
      # la primera vez y la enésima, y deja el Job corriendo la imagen de este
      # commit en vez de la que hubiera.
      - name: Desplegar el Job de respaldo diario
        run: |
          gcloud run jobs deploy pmo-respaldo-db             --image="${IMAGEN_RESPALDO}:${SHA}"             --region="${REGION}"             --service-account="pmo-respaldos@${PROJECT_ID}.iam.gserviceaccount.com"             --set-cloudsql-instances="${PROJECT_ID}:${REGION}:pmo-postgres-db"             --set-env-vars="BUCKET_RESPALDOS=pmo-respaldos-db"             --set-secrets="DATABASE_URL=pmo-database-url:latest,ALERT_WEBHOOK_URL=ALERT_WEBHOOK_URL:latest"             --max-retries=2             --task-timeout=900s             --quiet


      # ─────────────────────────────────────────────────────────────────────
      # El vigilante también nace del pipeline (2026-08-21)
      #
      # Hasta hoy `deploy.yml` desplegaba el Job y nada más: la política de
      # alerta y el Cloud Scheduler vivían **solo en la consola**. Es la misma
      # configuración fantasma que este archivo vino a eliminar, un piso más
      # arriba — y con un agravante: si alguien borra el vigilante, git no se
      # entera, y lo que desaparece es justo lo que avisaría de que algo falta.
      #
      # **Los dos pasos van al final y salen con 0 cuando no pueden trabajar.**
      # La API ya está desplegada y comprobada a estas alturas; un problema con
      # el respaldo no debe tumbar el despliegue del producto. El precio es que
      # el paso figura como correcto, así que **el texto del `::error::` es lo
      # único que avisa** — por eso cada uno dice qué quedó sin hacer, no solo
      # que algo falló.
      - name: Desplegar la politica de alerta del respaldo
        run: |
          set -eo pipefail

          POLITICA='[Capa 2] Fallo Critico: El respaldo de la base de datos'
          CANAL_NOMBRE='Alertas PMO'

          # `beta` no se da por hecho. En la máquina de Doc el componente
          # `alpha` **no estaba**, y este paso entero se apoya en `beta`:
          # descubrirlo el día que haga falta la alerta es tarde. Esta llamada
          # comprueba de paso que la cuenta del pipeline puede leer políticas.
          # ⚠️ Se captura la salida en vez de mandarla a `/dev/null`. La primera
          # version tragaba el motivo, y cuando la guarda salto de verdad el log
          # solo decia "no responde" -- que es el mismo pecado que la alerta muda
          # que todo esto viene a arreglar: **una guarda que esconde por que salta
          # es media guarda**.
          if ! SALIDA=$(gcloud beta monitoring policies list --project "${PROJECT_ID}" --limit=1 2>&1); then
            echo "Lo que respondio gcloud:"
            printf '%s\n' "${SALIDA}"
            echo "::error::gcloud beta monitoring no responde en el runner (componente ausente o sin permiso; el motivo exacto esta justo encima). NO se toca la politica de alerta del respaldo: queda desplegada la que hubiera. Hasta que se arregle, nadie garantiza que un respaldo fallido avise."
            exit 0
          fi

          # ── El canal, por nombre y no por id ──────────────────────────────
          # El id de consola no viaja en el repositorio: sólo significa algo en
          # este proyecto y, si el canal se recrea, cambia sin que nada avise.
          CANAL=$(gcloud beta monitoring channels list \
            --project "${PROJECT_ID}" \
            --filter="displayName=\"${CANAL_NOMBRE}\"" \
            --format='value(name)')

          # ⚠️ El `|| true` **no es decorativo**: `grep -c` sale con 1 cuando no
          # cuenta nada, y el shell de Actions corre con `-e`. Sin él, el caso
          # «no hay canal» mataría el paso aquí mismo con un error genérico, y
          # nunca se llegaría a imprimir el `::error::` que explica qué pasa.
          NUM=$(printf '%s\n' "${CANAL}" | grep -c . || true)

          if [ "${NUM}" -eq 0 ]; then
            echo "::error::Canal '${CANAL_NOMBRE}' no encontrado. NO se toca la politica: mejor la vieja que una muda."
            exit 0
          fi
          if [ "${NUM}" -gt 1 ]; then
            echo "::error::Hay ${NUM} canales llamados '${CANAL_NOMBRE}'. NO se toca la politica: elegir a ciegas entre dos destinos es como se queda muda sin que se note."
            exit 0
          fi

          # Tercera forma de quedarse mudo: el canal existe y está apagado. Va
          # aparte y **no en el filtro** — filtrando, un canal desactivado daría
          # cero coincidencias y este paso diría «no encontrado» de algo que
          # está delante. «No encontrado» manda a buscar; «existe pero está
          # apagado» manda a encenderlo.
          ACTIVO=$(gcloud beta monitoring channels describe "${CANAL}" \
            --project "${PROJECT_ID}" --format='value(enabled)')
          if [ "${ACTIVO}" != "True" ] && [ "${ACTIVO}" != "true" ]; then
            echo "::error::El canal '${CANAL_NOMBRE}' EXISTE pero esta DESACTIVADO (enabled=${ACTIVO}). La politica apunta a el y no llegara nada a nadie. Reactivalo en Monitoring > Notification channels."
            exit 0
          fi

          echo "Canal resuelto: ${CANAL} (enabled=${ACTIVO})"

          # ── Crear o actualizar, nunca duplicar ────────────────────────────
          # Un `create` repetido **no falla**: crea una segunda política igual.
          # A partir de ahí cada fallo avisa dos veces, y el final de esa
          # historia es alguien silenciando el canal.
          ID=$(gcloud beta monitoring policies list \
            --project "${PROJECT_ID}" \
            --filter="displayName=\"${POLITICA}\"" \
            --format='value(name)')
          NUMP=$(printf '%s\n' "${ID}" | grep -c . || true)

          if [ "${NUMP}" -gt 1 ]; then
            echo "::error::Hay ${NUMP} politicas llamadas '${POLITICA}'. NO se toca ninguna: actualizar una y dejar la otra deja avisos duplicados y una politica huerfana. Borra las sobrantes a mano en Monitoring > Alerting."
            exit 0
          fi

          jq --arg canal "${CANAL}" '.notificationChannels = [$canal]' \
            infra/alert_policy_respaldo.json > /tmp/politica.json

          if [ "${NUMP}" -eq 0 ]; then
            echo "No existe: se crea."
            gcloud beta monitoring policies create \
              --project "${PROJECT_ID}" \
              --policy-from-file=/tmp/politica.json
          else
            echo "Ya existe (${ID}): se actualiza."
            gcloud beta monitoring policies update "${ID}" \
              --project "${PROJECT_ID}" \
              --policy-from-file=/tmp/politica.json
          fi

          # ── Releer, porque una politica muda parece sana ──────────────────
          # `enabled: true` y `notificationChannels: []` es indistinguible de
          # una política correcta desde fuera. Ya pasó: la del watcher de Gmail
          # estuvo así seis días. No se da por hecho lo que se acaba de escribir.
          FINAL=$(gcloud beta monitoring policies list \
            --project "${PROJECT_ID}" \
            --filter="displayName=\"${POLITICA}\"" \
            --format='value(notificationChannels)')
          if [ -z "${FINAL}" ]; then
            echo "::error::La politica '${POLITICA}' quedo SIN CANAL despues de desplegarla. Esta encendida y es muda: evalua, abre incidencias y no se lo cuenta a nadie. Arreglalo antes de fiarte de la alerta."
            exit 0
          fi
          echo "Politica desplegada y verificada. Avisa a: ${FINAL}"

      # El disparador, que hasta hoy tampoco estaba en ningún sitio versionado.
      #
      # ⚠️ **`--schedule` y la ventana de la alerta van atados.** La condición de
      # ausencia de la política salta a las **14 h** sin un volcado correcto, y
      # ese número sólo es sostenible porque hay **dos** respaldos al día. Con
      # cadencia diaria la alerta saltaría todas las noches y alguien acabaría
      # apagándola. Si algún día se toca esta línea, se toca la `duration` de
      # `infra/alert_policy_respaldo.json` en el mismo commit.
      - name: Desplegar el disparador del respaldo
        run: |
          set -eo pipefail

          # ⚠️ **Este paso solo puede `create` o `update`. Nunca `delete`, nunca
          # `pause`.** No es estilo: `roles/cloudscheduler.admin` —el minimo que
          # existe, porque Cloud Scheduler no admite IAM por trabajo— le da al
          # pipeline poder para borrar o pausar el disparador. Y un disparador que
          # no dispara es **el punto ciego exacto** que la condicion de ausencia
          # existe para cubrir: no deja ejecucion, no deja fallo, no deja nada.
          #
          # Un `delete` aqui convertiria un error de tipeo en «se acabaron los
          # respaldos», y solo se notaria 14 h despues. Si alguien anade una de
          # esas dos verbos a este paso, lo esta rompiendo aunque el run salga
          # verde. Condicion puesta por Doc al conceder el rol.
          TRABAJO=pmo-respaldo-db-diario

          if ! SALIDA=$(gcloud scheduler jobs list --project "${PROJECT_ID}" --location "${REGION}" --limit=1 2>&1); then
            echo "Lo que respondio gcloud:"
            printf '%s\n' "${SALIDA}"
            echo "::error::gcloud scheduler no responde en el runner (el motivo exacto esta justo encima). NO se toca el disparador: queda el que hubiera. Si no habia ninguno, no hay respaldos automaticos."
            exit 0
          fi

          # `create` falla si existe y `update` falla si no existe, así que hay
          # que preguntar antes. `describe` es la pregunta más barata.
          if gcloud scheduler jobs describe "${TRABAJO}" \
               --project "${PROJECT_ID}" --location "${REGION}" >/dev/null 2>&1; then
            ACCION=update
          else
            ACCION=create
          fi
          echo "El disparador ${TRABAJO}: se hace ${ACCION}."

          gcloud scheduler jobs "${ACCION}" http "${TRABAJO}" \
            --project="${PROJECT_ID}" \
            --location="${REGION}" \
            --schedule="30 3,15 * * *" \
            --time-zone="America/Cancun" \
            --uri="https://${REGION}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${PROJECT_ID}/jobs/pmo-respaldo-db:run" \
            --http-method=POST \
            --oauth-service-account-email="pmo-scheduler@${PROJECT_ID}.iam.gserviceaccount.com" \
            --oauth-token-scope="https://www.googleapis.com/auth/cloud-platform" \
            --quiet

          # ── Pausado no es lo mismo que roto, pero se parece bastante ──────
          # `update` **no reanuda** un trabajo pausado, y el pipeline no lo
          # reanuda por su cuenta: alguien pudo pausarlo a propósito. Lo que sí
          # hace es decirlo, porque un disparador pausado no deja ni un rastro
          # de error en ningún log — sólo dejan de existir respaldos.
          ESTADO=$(gcloud scheduler jobs describe "${TRABAJO}" \
            --project "${PROJECT_ID}" --location "${REGION}" --format='value(state)')
          if [ "${ESTADO}" != "ENABLED" ]; then
            echo "::error::El disparador ${TRABAJO} esta en estado ${ESTADO}, no ENABLED. No se reanuda solo por si se pauso a proposito, pero mientras siga asi NO HAY RESPALDOS AUTOMATICOS. Reanudalo con: gcloud scheduler jobs resume ${TRABAJO} --location ${REGION}"
            exit 0
          fi
          echo "Disparador ${TRABAJO} ${ESTADO}: 03:30 y 15:30 America/Cancun."


      # La sonda del frontend, cada 30 minutos (Capa 2 del despliegue)
      #
      # **Pregunta en vez de esperar a que le cuenten**, que es toda la
      # diferencia con la Capa 1. Los avisos por evento —`deployment_status`,
      # `workflow_run`— solo cuentan lo que **llega a fallar**; si Vercel deja de
      # publicar su estado, si alguien desconecta la integración o si el build ni
      # se lanza, no hay evento y el silencio parece normalidad.
      #
      # ⚠️ **Cada 30 min y no cada 5.** La sonda concede una hora de margen antes
      # de reclamar —CI, build y la caché del CDN, que sirve copia vieja aunque
      # el recurso diga `no-store`: medido `Age: 988` el 2026-08-24— así que
      # preguntar más a menudo no adelanta nada y solo gasta cuota de la API de
      # GitHub. Si alguien cambia esta cadencia, **mira antes el margen y los
      # frenos de los avisos** en `frontend-al-dia.service.ts`: los tres números
      # van juntos.
      #
      # ⚠️ Igual que los demás: **solo `create` o `update`, nunca `delete` ni
      # `pause`.**
      - name: Desplegar la sonda del frontend
        run: |
          set -eo pipefail

          TRABAJO=pmo-frontend-al-dia

          if ! SALIDA=$(gcloud scheduler jobs list --project "${PROJECT_ID}" --location "${REGION}" --limit=1 2>&1); then
            echo "Lo que respondio gcloud:"
            printf '%s\n' "${SALIDA}"
            echo "::error::gcloud scheduler no responde en el runner (motivo exacto encima). NO se toca la sonda del frontend: nadie estara comprobando que produccion sirva el frontend que le toca."
            exit 0
          fi

          if gcloud scheduler jobs describe "${TRABAJO}" \
               --project "${PROJECT_ID}" --location "${REGION}" >/dev/null 2>&1; then
            ACCION=update
          else
            ACCION=create
          fi
          echo "La sonda ${TRABAJO}: se hace ${ACCION}."

          URL=$(gcloud run services describe "${SERVICE}" \
                  --project "${PROJECT_ID}" --region "${REGION}" --format 'value(status.url)')

          if [ -z "${URL}" ]; then
            echo "::error::No se pudo leer la URL de ${SERVICE}. NO se toca la sonda del frontend."
            exit 0
          fi

          # La audiencia es <URL>/cron, no <URL>: es lo que vale
          # CRON_OIDC_AUDIENCE en el servicio. Con la URL a secas el token se
          # firma bien, Scheduler lo da por entregado y la ruta devuelve 401
          # para siempre.
          gcloud scheduler jobs "${ACCION}" http "${TRABAJO}" \
            --project="${PROJECT_ID}" \
            --location="${REGION}" \
            --schedule="*/30 * * * *" \
            --time-zone="America/Cancun" \
            --uri="${URL}/cron/frontend-al-dia" \
            --http-method=POST \
            --oidc-service-account-email="pmo-scheduler@${PROJECT_ID}.iam.gserviceaccount.com" \
            --oidc-token-audience="${URL}/cron" \
            --quiet

          ESTADO=$(gcloud scheduler jobs describe "${TRABAJO}" \
            --project "${PROJECT_ID}" --location "${REGION}" --format='value(state)')
          if [ "${ESTADO}" != "ENABLED" ]; then
            echo "::error::La sonda ${TRABAJO} esta en estado ${ESTADO}, no ENABLED. Mientras siga asi, nadie comprueba que produccion sirva el frontend que le toca. Reanudala con: gcloud scheduler jobs resume ${TRABAJO} --location ${REGION}"
            exit 0
          fi
          echo "Sonda ${TRABAJO} ${ESTADO}: cada 30 min contra ${URL}/cron/frontend-al-dia"

      # El barrido de reconciliación, cada 15 minutos (§37.7)
      #
      # **Sustituye a `--min-instances=1` y al ping, y la comparación no la
      # decidió el precio.** Cloud Run escala a cero y con la instancia se apagan
      # los workers de BullMQ: un trabajo rezagado espera al siguiente correo, no
      # a un temporizador, porque `stalledInterval` necesita un worker vivo para
      # reclamar. Cualquier petición periódica arregla eso.
      #
      # Lo que sólo arregla el barrido es el otro agujero: un correo que se
      # guardó y cuyo `add` a la cola falló **no tiene trabajo que reintentar**.
      # Ni `min-instances` ni un ping lo ven nunca. El barrido despierta el
      # contenedor **y además** reencola lo que se quedó atrás.
      #
      # (El ping tampoco salía barato, que era el argumento aparente: con
      # `--no-cpu-throttling` se factura CPU mientras la instancia viva, así que
      # un ping cada cinco minutos la mantiene despierta casi todo el día y
      # cuesta casi lo mismo que `min-instances=1`, sin la garantía.)
      #
      # ⚠️ **Coste: ~0,10 USD al mes, no cero.** La decision escrita en `DOC.md`
      # dice «el nivel gratuito cubre tres trabajos y hoy se usa uno», y hoy se
      # usan **tres**: `pmo-respaldo-db-diario`, `pmo-gmail-watch-renew` y
      # `pmo-overdue-sweep`. Este es el cuarto, asi que sale del nivel gratuito.
      # Es calderilla y no cambia la decision -sigue siendo mucho mas barato que
      # `min-instances=1`- pero el numero estaba mal y no conviene repetirlo.
      #
      # ⚠️ Igual que el del respaldo: **sólo `create` o `update`, nunca `delete`
      # ni `pause`.**
      - name: Desplegar el barrido de reconciliacion
        run: |
          set -eo pipefail

          TRABAJO=pmo-reconciliar-clasificacion

          if ! SALIDA=$(gcloud scheduler jobs list --project "${PROJECT_ID}" --location "${REGION}" --limit=1 2>&1); then
            echo "Lo que respondio gcloud:"
            printf '%s\n' "${SALIDA}"
            echo "::error::gcloud scheduler no responde en el runner (el motivo exacto esta justo encima). NO se toca el barrido de reconciliacion: los correos guardados sin encolar se quedaran sin recoger."
            exit 0
          fi

          if gcloud scheduler jobs describe "${TRABAJO}" \
               --project "${PROJECT_ID}" --location "${REGION}" >/dev/null 2>&1; then
            ACCION=update
          else
            ACCION=create
          fi
          echo "El barrido ${TRABAJO}: se hace ${ACCION}."

          # La URL del servicio no se escribe a mano: se pregunta. Un dominio
          # copiado aqui es la misma configuracion fantasma de siempre, y ademas
          # cambia si alguien recrea el servicio.
          URL=$(gcloud run services describe "${SERVICE}" \
                  --project "${PROJECT_ID}" --region "${REGION}" --format 'value(status.url)')

          if [ -z "${URL}" ]; then
            echo "::error::No se pudo leer la URL de ${SERVICE}. NO se toca el barrido de reconciliacion."
            exit 0
          fi

          # OIDC y no OAuth: la ruta la protege `CronAuthGuard`, que valida un
          # token de identidad firmado por `pmo-scheduler@`.
          #
          # ⚠️ **La audiencia es `<URL>/cron`, no `<URL>`.** El guard compara con
          # `CRON_OIDC_AUDIENCE`, que en el servicio vale `https://.../cron`
          # -comprobado en la revision desplegada, y es tambien lo que llevan
          # `pmo-overdue-sweep` y `pmo-gmail-watch-renew`-. Con la URL a secas el
          # token se firma bien, Scheduler lo da por entregado y la ruta
          # devuelve **401 para siempre**.
          gcloud scheduler jobs "${ACCION}" http "${TRABAJO}" \
            --project="${PROJECT_ID}" \
            --location="${REGION}" \
            --schedule="*/15 * * * *" \
            --time-zone="America/Cancun" \
            --uri="${URL}/cron/reconciliar" \
            --http-method=POST \
            --oidc-service-account-email="pmo-scheduler@${PROJECT_ID}.iam.gserviceaccount.com" \
            --oidc-token-audience="${URL}/cron" \
            --quiet

          ESTADO=$(gcloud scheduler jobs describe "${TRABAJO}" \
            --project "${PROJECT_ID}" --location "${REGION}" --format='value(state)')
          if [ "${ESTADO}" != "ENABLED" ]; then
            echo "::error::El barrido ${TRABAJO} esta en estado ${ESTADO}, no ENABLED. Mientras siga asi, un correo guardado sin encolar no lo recoge nadie. Reanudalo con: gcloud scheduler jobs resume ${TRABAJO} --location ${REGION}"
            exit 0
          fi
          echo "Barrido ${TRABAJO} ${ESTADO}: cada 15 min contra ${URL}/cron/reconciliar"

      # El Job queda desplegado, pero **no se ejecuta aquí**: lo dispara Cloud
      # Scheduler a las 03:30 y las 15:30 de Tulum. Ejecutarlo en cada despliegue
      # haría un volcado completo por cada commit, que ni hace falta ni es gratis.
      #
      # Para probarlo a mano:
      #   gcloud run jobs execute pmo-respaldo-db --region us-central1 --wait
      - name: Recordar cómo probar el respaldo
        run: |
          echo "Job pmo-respaldo-db desplegado con la imagen ${SHA}."
          echo "Lo dispara Cloud Scheduler (pmo-respaldo-db-diario) a las 03:30 y 15:30 America/Cancun."
          echo "Prueba manual: gcloud run jobs execute pmo-respaldo-db --region ${REGION} --wait"

      # ─────────────────────────────────────────────────────────────────────
      # Que el avisador tenga con qué avisar — y que se sepa ANTES del incendio
      #
      # ⚠️ **Esta comprobación existe por una trampa que casi construimos.** El
      # job de aviso de más abajo solo corre `if: failure()`, así que si le
      # faltara la credencial **no se sabría hasta la primera avería de verdad**:
      # el aviso de la avería, averiado, descubierto en el peor momento.
      #
      # Aquí se mira en **cada despliegue correcto**, que es cuando no cuesta
      # nada. No falla el despliegue —el respaldo no debe tumbar el producto y
      # esto tampoco— pero deja el aviso escrito en el resumen del run.
      - name: Comprobar que el avisador tiene con que avisar
        if: ${{ always() }}
        run: |
          if [ -z "${{ secrets.ALERT_WEBHOOK_URL }}" ]; then
            echo "::warning::El secreto ALERT_WEBHOOK_URL de GitHub Actions no esta puesto. Si este despliegue falla, NADIE se enterara. Se crea con: gh secret set ALERT_WEBHOOK_URL --body '<url del webhook de Chat>'"
          else
            echo "El avisador de fallos tiene su webhook."
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # El aviso cuando el despliegue de la API se cae
  #
  # **Job aparte y no un paso, y la diferencia es la que hace que funcione.** Un
  # paso dentro de `deploy` no se ejecuta si el job murió antes de llegar a él, y
  # no se ejecuta en absoluto si lo que falló fue el arranque del propio job.
  #
  # `needs: deploy` **es obligatorio**: es lo único que da acceso al resultado del
  # otro job. Lo que lo hace correr cuando el otro se cae es `if: failure()`, que
  # sin `needs` no tendría nada que mirar.
  #
  # ⚠️ **Esto NO cubre Vercel**, y conviene tenerlo presente para no dar la Capa 1
  # por cerrada: Vercel construye desde su propia integración de Git y no hay ni
  # un paso suyo en estos workflows. Eso vive en `alerta-despliegue.yml`, con
  # `on: deployment_status`. Tampoco cubre el fallo de **CI**: si CI falla, este
  # workflow ni se lanza, así que no hay job caído al que colgarle un `needs`.
  # ───────────────────────────────────────────────────────────────────────────
  avisar-fallo:
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ failure() }}

    steps:
      - name: Avisar a Chat
        env:
          # Secreto de GitHub y no Secret Manager, a propósito: lo vigilado
          # incluye la autenticación del pipeline contra GCP, así que un avisador
          # que también se autenticara contra GCP fallaría con ella. El motivo
          # completo está en `alerta-despliegue.yml`.
          #
          # ⚠️ Tiene que coincidir con el secreto `ALERT_WEBHOOK_URL` de Secret
          # Manager: **rotar el webhook obliga a tocar los dos sitios**.
          URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          set -eo pipefail

          if [ -z "${URL}" ]; then
            echo "::error::El secreto ALERT_WEBHOOK_URL de GitHub Actions no existe o esta vacio. El despliegue de la API ha fallado y NO se ha avisado a nadie."
            exit 1
          fi

          COMMIT="${{ github.event.workflow_run.head_sha || github.sha }}"
          ENLACE="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          TEXTO=$(printf '🔴 *Despliegue fallido: API en Cloud Run*\n%s\nCommit: %s\nLog: %s' \
                    "${{ github.event.workflow_run.display_title || github.workflow }}" \
                    "${COMMIT:0:7}" "${ENLACE}")

          if ! curl -sS --fail -m 10 -X POST \
                 -H 'content-type: application/json' \
                 -d "$(jq -n --arg t "${TEXTO}" '{text: $t}')" \
                 "${URL}" >/dev/null; then
            echo "::error::El webhook rechazo el aviso. El despliegue fallido NO se ha comunicado a nadie."
            exit 1
          fi

          echo "Aviso enviado del fallo en ${COMMIT:0:7}"
