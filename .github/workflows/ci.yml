name: CI

# La rama de trabajo de este proyecto es `master`. Hasta el 2026-07-30 esto
# escuchaba `main`, que no existe: el CI no se disparó nunca y por eso un
# `npm run lint` roto sobrevivió al proyecto entero sin que nadie lo notara.
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    # Node 22. No es por estar al día: **ESLint 10 exige
    # `^20.19.0 || ^22.13.0 || >=24`**, y `node-version: '20.x'` deja que el
    # runner elija cualquier 20 — si le toca una anterior a la 20.19, eslint ni
    # arranca y el paso de linter muere con exit 1 sin decir una sola regla.
    # Fijar 22 quita esa lotería. Cuando el proyecto se despliegue en Cloud Run,
    # esta versión y la del contenedor deben ser la misma.
    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # `--max-warnings 0`: los avisos también cortan, desde el 2026-08-03.
    #
    # Hasta ese día esto iba sin la bandera a propósito, porque quedaban 28
    # `no-explicit-any` heredados y casi todos vivían en `apps/web`, que es de
    # otro dominio: encenderla habría cortado en el primer push por deuda que
    # no le tocaba arreglar a quien empujara. Gravity la saldó en `9501647`
    # —los 28, en 11 archivos— y los tres paquetes salen hoy en cero avisos.
    # Esa era la condición para encenderla, y este paso es lo que impide que
    # vuelvan a entrar de uno en uno.
    #
    # Ojo con la forma de invocarlo: **no** vale `npm run lint -- --max-warnings 0`.
    # El script de la raíz es `npm --workspaces --if-present run lint`, así que
    # el argumento se lo quedaría npm como flag propia en vez de llegar a
    # eslint, y el paso pasaría a ser decorativo sin decirlo. Recorriendo los
    # workspaces aquí, el `--` sí llega a cada `eslint` (comprobado).
    - name: Run Linter
      run: npm run lint --workspaces --if-present -- --max-warnings 0

    - name: Build Projects
      run: npm run build

    # Unitarios con dependencias simuladas: no necesitan Postgres, Redis ni la
    # API de Anthropic. Van después del build porque es el build quien hace el
    # type-check completo (los tests transpilan sin comprobar tipos).
    - name: Run Tests
      run: npm test --if-present
