name: CI

# La rama de trabajo de este proyecto es `master`. Hasta el 2026-07-30 esto
# escuchaba `main`, que no existe: el CI no se disparó nunca y por eso un
# `npm run lint` roto sobrevivió al proyecto entero sin que nadie lo notara.
#
# ─────────────────────────────────────────────────────────────────────────
# Corre en TODOS los commits, también en los de solo documentación (05-10)
#
# Hasta el 05-10 había aquí un `paths-ignore` (`**/*.md`, `docs/**`, …) para que
# un commit de bitácora no disparara el despliegue. Se quitó por C12: este CI
# va a ser el check **obligatorio** para fusionar en `master`, y un workflow que
# se salta por `paths-ignore` deja su check «pendiente» para siempre, así que la
# fusión de un commit de solo documentación quedaría bloqueada.
#
# Lo que se salta ahora es el **despliegue**: `deploy.yml` y
# `publicar-frontend.yml` comparan lo que sirve producción con el commit
# aprobado (`.github/scripts/hay-que-desplegar.sh`) y no despliegan si solo
# cambia documentación. El filtro no puede ir en ellos como `paths-ignore`:
# **`workflow_run` no admite `paths` ni `paths-ignore`** y GitHub los ignora en
# silencio.
# ─────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  # ─────────────────────────────────────────────────────────────────────────
  # workflow_dispatch — el botón que faltaba (2026-08-12)
  #
  # Hasta hoy **no había forma de publicar sin inventarse un commit**. El
  # despliegue cuelga de `workflow_run` de este workflow, y este workflow solo
  # corría por `push` o `pull_request` con el filtro de arriba. Consecuencia:
  # cambiar una variable de repositorio —`WEB_URL`, `GOOGLE_REDIRECT_URI`, un
  # id de modelo— **no la aplicaba**, porque las variables se leen en tiempo de
  # despliegue y no había despliegue que dispararlas. Y un commit de solo `.md`
  # tampoco servía: lo salta el `paths-ignore`.
  #
  # Lo que se hacía en su lugar era tocar Cloud Run a mano con
  # `gcloud run services update`, que funciona pero deja la revisión **fuera
  # del pipeline**: el siguiente despliegue de verdad la pisa entera, porque
  # abajo se despliega con `--set-env-vars`, que reemplaza el conjunto, no lo
  # completa. Así se perdió configuración inyectada en caliente más de una vez.
  #
  # (Desde el 05-10 ya no hay `paths-ignore`: ver la cabecera. Para aplicar una
  # variable sin commit, el botón bueno es el `workflow_dispatch` de `deploy.yml`
  # o de `publicar-frontend.yml`, que despliegan siempre.)
  # ─────────────────────────────────────────────────────────────────────────
  workflow_dispatch:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    # Node 22. No es por estar al día: **ESLint 10 exige
    # `^20.19.0 || ^22.13.0 || >=24`**, y `node-version: '20.x'` deja que el
    # runner elija cualquier 20 — si le toca una anterior a la 20.19, eslint ni
    # arranca y el paso de linter muere con exit 1 sin decir una sola regla.
    # Fijar 22 quita esa lotería. Cuando el proyecto se despliegue en Cloud Run,
    # esta versión y la del contenedor deben ser la misma.
    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # `--max-warnings 0`: los avisos también cortan, desde el 2026-08-03.
    #
    # Hasta ese día esto iba sin la bandera a propósito, porque quedaban 28
    # `no-explicit-any` heredados y casi todos vivían en `apps/web`, que es de
    # otro dominio: encenderla habría cortado en el primer push por deuda que
    # no le tocaba arreglar a quien empujara. Gravity la saldó en `9501647`
    # —los 28, en 11 archivos— y los tres paquetes salen hoy en cero avisos.
    # Esa era la condición para encenderla, y este paso es lo que impide que
    # vuelvan a entrar de uno en uno.
    #
    # Ojo con la forma de invocarlo: **no** vale `npm run lint -- --max-warnings 0`.
    # El script de la raíz es `npm --workspaces --if-present run lint`, así que
    # el argumento se lo quedaría npm como flag propia en vez de llegar a
    # eslint, y el paso pasaría a ser decorativo sin decirlo. Recorriendo los
    # workspaces aquí, el `--` sí llega a cada `eslint` (comprobado).
    - name: Run Linter
      run: npm run lint --workspaces --if-present -- --max-warnings 0

    - name: Build Projects
      run: npm run build

    # Unitarios con dependencias simuladas: no necesitan Postgres, Redis ni la
    # API de Anthropic. Van después del build porque es el build quien hace el
    # type-check completo (los tests transpilan sin comprobar tipos).
    - name: Run Tests
      run: npm test --if-present
